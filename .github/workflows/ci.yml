name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile scripts
        run: python3 -m py_compile skills/vbs/scripts/*.py
